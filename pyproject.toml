[project]
name = "booking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elizaveta Shingina", email = "shinginaelizaveta@mail.ru" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.128.8",
    "pydantic-settings>=2.11.0",
    "structlog>=25.5.0",
]

[project.scripts]
booking = "booking:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
